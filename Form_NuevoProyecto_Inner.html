<div id="formProyectoInner">
  <div class="mb-3">
    <label class="form-label">Nombre del Proceso</label>
    <input type="text" id="nombre" class="form-control" placeholder="Ej: Adjudicación de Contratos">
  </div>
  <div class="mb-3">
    <label class="form-label">Área Responsable</label>
    <select id="area" class="form-select">
      <!-- Cargado dinámicamente -->
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Responsable (Email)</label>
    <input type="email" id="responsable" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Observaciones</label>
    <textarea id="obs" class="form-control" rows="3"></textarea>
  </div>
  <button onclick="enviarProyecto()" id="btnEnviarProy" class="btn btn-primary w-100">Crear Proyecto</button>
  <div id="statusProy" class="mt-3 text-center small"></div>
</div>

<script>
  function cargarAreas() {
    google.script.run.withSuccessHandler(areas => {
      const select = document.getElementById('area');
      select.innerHTML = '';
      areas.forEach(a => {
        let opt = document.createElement('option');
        opt.value = a;
        opt.innerHTML = a;
        select.appendChild(opt);
      });
    }).getListaAreas();
  }

  // Cargar áreas al inicio (para web app)
  if(typeof google !== 'undefined') cargarAreas();

  function enviarProyecto() {
    const btn = document.getElementById('btnEnviarProy');
    btn.disabled = true;
    document.getElementById('statusProy').innerText = "Procesando...";

    const datos = {
      nombreProceso: document.getElementById('nombre').value,
      areaResponsable: document.getElementById('area').value,
      responsable: document.getElementById('responsable').value,
      observaciones: document.getElementById('obs').value
    };

    google.script.run
      .withSuccessHandler(res => {
        if(res.success) {
          document.getElementById('statusProy').innerHTML = `<div class="alert alert-success">¡Proyecto creado! ID: ${res.idProyecto}</div>`;
          document.getElementById('nombre').value = '';
          btn.disabled = false;
        } else {
          document.getElementById('statusProy').innerText = "Error: " + res.mensaje;
          btn.disabled = false;
        }
      })
      .withFailureHandler(err => {
        document.getElementById('statusProy').innerText = "Error crítico: " + err;
        btn.disabled = false;
      })
      .crearNuevoProyecto(datos);
  }
</script>
