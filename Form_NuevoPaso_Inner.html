<div id="formPasoInner">
  <input type="hidden" id="editIdRegistro" value="">

  <div class="mb-3">
    <label class="form-label">ID Proyecto</label>
    <div class="input-group">
      <input type="text" id="idProy" class="form-control" placeholder="VSM-2026-XXXX">
      <button class="btn btn-outline-secondary" type="button" onclick="cargarUltimoID()">Último</button>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Escenario</label>
      <select id="escenario" class="form-select">
        <option value="Actual">Actual (As-Is)</option>
        <option value="Propuesto">Propuesto (To-Be)</option>
      </select>
    </div>
    <div class="col">
      <label class="form-label">Valor Lean</label>
      <select id="etiqueta" class="form-select" onchange="toggleVA()">
        <option value="VA">Valor Añadido (VA)</option>
        <option value="VNA-N">VNA Necesario (VNA-N)</option>
        <option value="VNA">Desperdicio (VNA)</option>
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Nombre Actividad</label>
    <input type="text" id="nombrePaso" class="form-control">
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">T. Trabajo (min)</label>
      <input type="number" id="tVa" class="form-control" value="0">
    </div>
    <div class="col">
      <label class="form-label">T. Espera (min)</label>
      <input type="number" id="tEsp" class="form-control" value="0">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Responsable Paso</label>
    <input type="text" id="resp" class="form-control">
  </div>

  <div id="btnContainerPaso">
    <button onclick="guardarPaso()" id="btnGuardarPaso" class="btn btn-success w-100">Registrar Paso</button>
  </div>
  <div id="statusPaso" class="mt-2 small text-center"></div>
</div>

<script>
  function cargarUltimoID() {
    google.script.run.withSuccessHandler(id => {
      if(id) document.getElementById('idProy').value = id;
    }).ultimoIdProyecto();
  }

  function toggleVA() {
    const val = document.getElementById('etiqueta').value;
    if(val === 'VA') {
      document.getElementById('tEsp').value = 0;
      document.getElementById('tEsp').disabled = true;
    } else {
      document.getElementById('tEsp').disabled = false;
    }
  }

  function prepararEdicionPaso(idRegistro) {
    document.getElementById('statusPaso').innerText = "Cargando datos...";
    google.script.run.withSuccessHandler(paso => {
      if(!paso) return;
      document.getElementById('editIdRegistro').value = idRegistro;
      document.getElementById('idProy').value = paso.ID_Proyecto_FK;
      document.getElementById('escenario').value = paso.Escenario;
      document.getElementById('etiqueta').value = paso.Etiqueta_Valor;
      document.getElementById('nombrePaso').value = paso.Nombre_Actividad;
      document.getElementById('tVa').value = paso.Tiempo_Actividad_Min;
      document.getElementById('tEsp').value = paso.Tiempo_Espera_Min;
      document.getElementById('resp').value = paso.Responsable_Paso;

      document.getElementById('btnContainerPaso').innerHTML = `
        <div class="btn-group w-100">
          <button onclick="actualizarPaso()" class="btn btn-primary">Actualizar</button>
          <button onclick="cancelarEdicionPaso()" class="btn btn-secondary">Cancelar</button>
        </div>
      `;
      document.getElementById('statusPaso').innerText = "";
      toggleVA();
    }).getPaso(idRegistro);
  }

  function cancelarEdicionPaso() {
    document.getElementById('editIdRegistro').value = "";
    document.getElementById('nombrePaso').value = "";
    document.getElementById('btnContainerPaso').innerHTML = '<button onclick="guardarPaso()" id="btnGuardarPaso" class="btn btn-success w-100">Registrar Paso</button>';
  }

  function actualizarPaso() {
    const idReg = document.getElementById('editIdRegistro').value;
    const datos = {
      nombreActividad: document.getElementById('nombrePaso').value,
      tiempoActividad: document.getElementById('tVa').value,
      tiempoEspera: document.getElementById('tEsp').value,
      // Se pueden añadir más campos según necesidad
    };

    google.script.run.withSuccessHandler(res => {
      if(res.success) {
        document.getElementById('statusPaso').innerHTML = '<div class="alert alert-success">Paso actualizado.</div>';
        cancelarEdicionPaso();
      }
    }).editarPaso(idReg, datos);
  }

  function guardarPaso() {
    const btn = document.getElementById('btnGuardarPaso');
    btn.disabled = true;
    document.getElementById('statusPaso').innerText = "Guardando...";

    const datos = {
      idProyecto: document.getElementById('idProy').value,
      escenario: document.getElementById('escenario').value,
      etiquetaValor: document.getElementById('etiqueta').value,
      nombreActividad: document.getElementById('nombrePaso').value,
      tiempoActividad: document.getElementById('tVa').value,
      tiempoEspera: document.getElementById('tEsp').value,
      responsablePaso: document.getElementById('resp').value,
      areaEjecutora: "General",
      cuelloBotella: "No"
    };

    google.script.run
      .withSuccessHandler(res => {
        if(res.success) {
          document.getElementById('statusPaso').innerHTML = '<div class="alert alert-success">Paso registrado.</div>';
          document.getElementById('nombrePaso').value = "";
          btn.disabled = false;
        } else {
          document.getElementById('statusPaso').innerText = "Error: " + res.mensaje;
          btn.disabled = false;
        }
      })
      .withFailureHandler(err => {
        document.getElementById('statusPaso').innerText = "Error: " + err;
        btn.disabled = false;
      })
      .agregarPaso(datos.idProyecto, datos);
  }
</script>
