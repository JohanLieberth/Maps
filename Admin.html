<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="mock_gas.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Quiniela 2026</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; padding: 20px; color: #1e293b; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
    h1 { color: #4f46e5; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; }
    input { width: 50px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; }
    .btn-save { background: #10b981; }
    .btn-seed { background: #ef4444; margin-bottom: 20px; }
    #status { margin-top: 10px; font-weight: bold; border-radius: 8px; padding: 10px; display: none; }
    .status-ok { background: #d1fae5; color: #065f46; display: block !important; }
    .status-err { background: #fee2e2; color: #991b1b; display: block !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Panel de Administración ⚽</h1>
    <p>Solo visible para el administrador.</p>

    <button class="btn btn-seed" onclick="seed()">Resetear Torneo (Seed)</button>
    <button class="btn btn-seed" style="background:#3b82f6" onclick="testData()">Insertar Datos Prueba</button>
    <div id="status"></div>

    <h3>Actualizar Resultados</h3>
    <div id="lista-admin">Cargando partidos...</div>
  </div>

  <script>
    function setStatus(msg, isErr) {
      const el = document.getElementById('status');
      el.innerText = msg;
      el.className = isErr ? 'status-err' : 'status-ok';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function handleFailure(err) {
      setStatus("Error: " + (err.message || "Fallo en el servidor"), true);
    }

    function seed() {
      if(!confirm("¿Borrar todos los datos y reiniciar el calendario?")) return;
      document.getElementById('lista-admin').innerText = "Procesando...";
      google.script.run
        .withSuccessHandler(() => {
          setStatus("Torneo reseteado exitosamente.", false);
          cargar();
        })
        .withFailureHandler(handleFailure)
        .seedPartidos();
    }

    function testData() {
      google.script.run
        .withSuccessHandler(res => {
          setStatus(res.message, !res.success);
          cargar();
        })
        .withFailureHandler(handleFailure)
        .insertarDatosPrueba();
    }

    function cargar() {
      google.script.run
        .withSuccessHandler(partidos => {
          if(!partidos || partidos.length === 0) {
            document.getElementById('lista-admin').innerHTML = "No hay partidos. Ejecuta 'Seed'.";
            return;
          }
          let h = `<table><tr><th>ID</th><th>Partido</th><th>Resultado</th><th>Acción</th></tr>`;
          partidos.forEach(p => {
            const resL = p.golLocalReal !== null ? p.golLocalReal : "";
            const resV = p.golVisitaReal !== null ? p.golVisitaReal : "";
            h += `<tr>
              <td>${p.idPartido}</td>
              <td>${p.equipoLocal} vs ${p.equipoVisita}</td>
              <td>
                <input type="number" id="L-${p.idPartido}" value="${resL}"> -
                <input type="number" id="V-${p.idPartido}" value="${resV}">
              </td>
              <td><button class="btn btn-save" onclick="guardar('${p.idPartido}')">Guardar</button></td>
            </tr>`;
          });
          h += `</table>`;
          document.getElementById('lista-admin').innerHTML = h;
        })
        .withFailureHandler(handleFailure)
        .obtenerPartidos();
    }

    function guardar(id) {
      const gl = document.getElementById('L-'+id).value;
      const gv = document.getElementById('V-'+id).value;
      if(gl === "" || gv === "") return alert("Ingresa ambos goles");

      google.script.run
        .withSuccessHandler(res => {
          setStatus(res.message || "Resultado guardado", !res.success);
          if(res.success) cargar();
        })
        .withFailureHandler(handleFailure)
        .actualizarResultadoManual(id, parseInt(gl), parseInt(gv));
    }

    window.onload = cargar;
  </script>
</body>
</html>
