  <body>

        <!-- MAIN -->
        <main class="col-md-10 main-content">
          <div id="loader" class="text-center mb-4 loading-spinner">
             <div class="spinner-border text-primary" role="status"></div>

          <!-- DASHBOARD -->
          <div id="view-dashboard" class="view active">

          <!-- LISTADO PROYECTOS -->
          <div id="view-listado" class="view">
            <div class="d-flex justify-content-between align-items-center mb-4">

              <button class="btn btn-primary" onclick="loadView('nuevo-proy')">Nuevo Proyecto</button>

            <div class="card">
              <div class="card-body p-0">
                <table class="table table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>ID</th>
                      <th>Proceso</th>

                      <th>PCE %</th>

                    </tr>

                  <tbody id="lista-proyectos-body">

                  </tbody>
                </table>

          <!-- FORM NUEVO PROYECTO -->
          <div id="view-nuevo-proy" class="view">
            <div class="card mx-auto" style="max-width: 600px;">

          <!-- FORM AGREGAR PASO -->
          <div id="view-agregar-paso" class="view">
            <div class="card mx-auto" style="max-width: 600px;">
              <div class="card-body">
                <h3 class="mb-4">Agregar Actividad al Proyecto</h3>

          <!-- VISTA MODIFICAR ACTIVIDADES -->
          <div id="view-ver-actividades" class="view">
             <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 id="titulo-actividades">Actividades del Proyecto</h2>
              <button class="btn btn-outline-secondary" onclick="loadView('listado')">Volver</button>

        </main>
      </div>
    </div>

    <script>
      function toggleLoader(show) {
        document.getElementById('loader').style.display = show ? 'block' : 'none';
      }

      function loadView(viewId, params = {}) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        // (Opcional) Activar link en sidebar

        if (viewId === 'dashboard') loadDashboard();
        if (viewId === 'listado') loadProjectList();
        if (viewId === 'agregar-paso' && params.id) {
          document.getElementById('idProy').value = params.id;
          document.getElementById('active-project-info').innerText = "Proyecto Seleccionado: " + params.nombre;
        }
        if (viewId === 'ver-actividades' && params.id) {
          loadActivities(params.id, params.nombre);
        }
      }

      function loadDashboard() {
        toggleLoader(true);
        google.script.run
          .withSuccessHandler(stats => {
            toggleLoader(false);
            const container = document.getElementById('dash-stats');
            container.innerHTML = `
              <div class="col-md-3">
                <div class="card p-4 text-center">
                  <h1 class="text-primary">${stats.total}</h1>
                  <p class="text-muted mb-0">Total Proyectos</p>
                </div>
              </div>
              <div class="col-md-3">
                <div class="card p-4 text-center">
                  <h1 class="text-success">${stats.estados.Activo}</h1>
                  <p class="text-muted mb-0">Activos</p>
                </div>
              </div>
              <div class="col-md-3">
                <div class="card p-4 text-center">
                  <h1 class="text-info">${stats.estados.Completado}</h1>
                  <p class="text-muted mb-0">Completados</p>
                </div>
              </div>
              <div class="col-md-3">
                <div class="card p-4 text-center">
                  <h1 class="text-warning">${stats.ahorroTotal.toFixed(1)}</h1>
                  <p class="text-muted mb-0">Días-Hombre Ahorrados</p>
                </div>
              </div>
            `;
          })
          .getDashboardStats();
      }

      function loadProjectList() {
        toggleLoader(true);
        google.script.run
          .withSuccessHandler(projects => {
            toggleLoader(false);
            const tbody = document.getElementById('lista-proyectos-body');
            tbody.innerHTML = '';
            projects.forEach(p => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td class="small fw-bold">${p.id}</td>
                <td>${p.nombre}</td>
                <td class="small">${p.area}</td>
                <td><span class="badge badge-${p.estado.split(' ')[0]}">${p.estado}</span></td>
                <td>${(p.pce * 100).toFixed(1)}%</td>
                <td class="text-end">
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-success" onclick="loadView('agregar-paso', {id: '${p.id}', nombre: '${p.nombre}'})" title="Agregar Actividad">
                      <i class="bi bi-plus-lg"></i>
                    </button>
                    <button class="btn btn-outline-primary" onclick="loadView('ver-actividades', {id: '${p.id}', nombre: '${p.nombre}'})" title="Modificar Actividades">
                      <i class="bi bi-list-task"></i>
                    </button>
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          })
          .getProjectsData();
      }

      function loadActivities(id, nombre) {
        toggleLoader(true);
        document.getElementById('titulo-actividades').innerText = "Actividades: " + nombre;
        google.script.run
          .withSuccessHandler(activities => {
            toggleLoader(false);
            const container = document.getElementById('lista-actividades-container');
            if (activities.length === 0) {
              container.innerHTML = '<div class="p-4 text-center text-muted">No hay actividades registradas para este proyecto.</div>';
              return;
            }
            let html = '<table class="table table-sm mb-0"><thead><tr><th>Orden</th><th>Escenario</th><th>Nombre</th><th>Valor</th><th>LT (min)</th><th class="text-end">Acciones</th></tr></thead><tbody>';
            activities.forEach(a => {
              html += `<tr>
                <td>${a.secuencia}</td>
                <td>${a.escenario}</td>
                <td>${a.nombre}</td>
                <td>${a.valor}</td>
                <td>${a.leadTime}</td>
                <td class="text-end">
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-sm btn-outline-primary" onclick="editarActividad('${a.id}')" title="Modificar"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="borrarActividad('${a.id}', '${id}', '${nombre}')" title="Eliminar"><i class="bi bi-trash"></i></button>
                  </div>
                </td>
              </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
          })
          .getActivitiesByProject(id);
      }

      function editarActividad(idReg) {
        loadView('agregar-paso');
        prepararEdicionPaso(idReg);
      }

      function borrarActividad(idReg, idProy, nombreProy) {
        if(confirm('¿Está seguro de eliminar esta actividad? Esta acción no se puede deshacer.')) {
          toggleLoader(true);
          google.script.run.withSuccessHandler(res => {
            toggleLoader(false);
            if(res.success) {
              loadActivities(idProy, nombreProy);
            }
          }).eliminarPaso(idReg);
        }
      }

      window.onload = () => loadDashboard();
    </script>
  </body>
</html>
