<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiniela Mundial 2026</title>
  <style>
    :root {
      --color-primary: #4F46E5;
      --color-primary-dark: #3730A3;
      --color-primary-light: #818CF8;
      --color-secondary: #06B6D4;
      --color-secondary-light: #67E8F9;
      --color-accent: #0EA5E9;
      --color-bg: #F8FAFC;
      --color-bg-card: #FFFFFF;
      --color-bg-alt: #F1F5F9;
      --color-border: #E2E8F0;
      --color-border-focus: #94A3B8;
      --color-text: #0F172A;
      --color-text-secondary: #475569;
      --color-text-muted: #94A3B8;
      --color-success: #10B981;
      --color-success-bg: #D1FAE5;
      --color-warning: #F59E0B;
      --color-warning-bg: #FEF3C7;
      --color-error: #EF4444;
      --color-error-bg: #FEE2E2;
      --color-info: #3B82F6;
      --color-info-bg: #DBEAFE;
      --gradient-header: linear-gradient(135deg, #1E3A5F 0%, #0F172A 100%);
      --gradient-button: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .navbar {
      background: var(--gradient-header);
      border-bottom: 1px solid #1E293B;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.3);
      color: white;
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-logo {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.5px;
      font-size: 1.4rem;
      text-decoration: none;
    }

    .nav-tabs { display: flex; gap: 15px; }
    .navbar-tab {
      background: none; border: none; color: #CBD5E1; font-weight: 600; cursor: pointer;
      padding: 8px 12px; transition: all 0.2s; border-bottom: 2px solid transparent;
    }
    .navbar-tab:hover, .navbar-tab.active { color: #67E8F9; border-bottom: 2px solid #06B6D4; }

    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: 16px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      padding: 25px; margin-bottom: 20px;
    }

    .login-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
    @media (max-width: 768px) { .login-grid { grid-template-columns: 1fr; } }

    .card-selection { cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
    .card-selection.inactive { opacity: 0.6; transform: scale(0.98); }
    .card-selection.active { transform: scale(1.02); opacity: 1; border-color: var(--color-primary); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--color-text-secondary); }
    input[type="email"], input[type="text"], input[type="number"] {
      width: 100%; border: 2px solid #CBD5E1; border-radius: 10px; padding: 12px; font-size: 16px; box-sizing: border-box;
    }
    input:focus { border-color: var(--color-primary); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

    .btn-primary {
      background: var(--gradient-button); color: white; border: none; padding: 12px 32px;
      border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: transform 0.2s;
    }
    .btn-primary:hover { transform: translateY(-2px); }

    /* Estilos de Banderas */
    .bandera-img {
      width: 36px; height: 24px; border-radius: 3px; object-fit: cover;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25); vertical-align: middle;
      margin: 0 10px; border: 1px solid rgba(255, 255, 255, 0.3);
      background: #1E293B; transition: transform 0.2s ease;
    }
    .bandera-img:hover { transform: scale(1.15); }
    .bandera-fallback {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      color: white; font-size: 12px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; margin: 0 10px;
    }

    .fila-partido {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px; border-bottom: 1px solid var(--color-border);
      background: white; border-radius: 12px; margin-bottom: 8px;
    }
    .equipo-col { display: flex; align-items: center; width: 35%; }
    .equipo-col.local { justify-content: flex-end; text-align: right; }
    .equipo-col.visita { justify-content: flex-start; text-align: left; }
    .nombre-equipo { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }

    .marcadores { display: flex; align-items: center; gap: 10px; width: 25%; justify-content: center; }
    .input-marcador {
      width: 55px; height: 45px; font-size: 20px; font-weight: bold; text-align: center;
      border: 2px solid #CBD5E1; border-radius: 10px;
    }
    .input-marcador:disabled { background: #F1F5F9; color: #94A3B8; cursor: not-allowed; }

    .estado-col { width: 15%; text-align: center; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: block; margin-bottom: 4px; }
    .badge-abierto { background: #DBEAFE; color: #1E40AF; }
    .badge-cerrado { background: #FEE2E2; color: #B91C1C; }
    .badge-jugado { background: #D1FAE5; color: #047857; }
    .contador { font-size: 11px; color: #64748B; font-weight: 600; }

    .fase-header {
      background: var(--gradient-header); color: white; padding: 10px;
      border-radius: 8px; margin: 20px 0 10px 0; text-align: center; font-weight: bold;
    }

    .sticky-footer {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); text-align: center; z-index: 100;
    }

    #toast {
      position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 10px;
      color: white; font-weight: bold; display: none; z-index: 2000;
    }
    #spinner {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 3000;
    }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--color-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="spinner"><div class="loader"></div></div>
  <div id="toast"></div>

  <nav class="navbar" id="navbar" style="display: none;">
    <a href="#" class="navbar-logo">🏆 QUINIELA 2026</a>
    <div class="nav-tabs">
      <button onclick="showView('pronosticos')" class="navbar-tab" id="tab-pronosticos">Mis Pronósticos</button>
      <button onclick="showView('ranking')" class="navbar-tab" id="tab-ranking">Ranking</button>
      <button onclick="showView('resultados')" class="navbar-tab" id="tab-resultados">Resultados</button>
    </div>
  </nav>

  <div class="container">
    <div id="view-login" class="view active">
      <div style="text-align: center; margin-bottom: 30px;">
        <h1>MUNDIAL 2026 ❄️</h1>
        <p>Regístrate o ingresa para jugar</p>
      </div>
      <div class="login-grid">
        <div class="card card-selection active" id="card-reg" onclick="activateCard('reg')">
          <h2>NUEVO USUARIO</h2>
          <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
          <div class="form-group"><label>Nombre</label><input type="text" id="reg-nombre"></div>
          <div class="form-group"><label>Alias (máx 15)</label><input type="text" id="reg-alias" maxlength="15"></div>
          <button class="btn-primary" onclick="registrar()">REGISTRARME</button>
        </div>
        <div class="card card-selection" id="card-login" onclick="activateCard('login')">
          <h2>YA TENGO CUENTA</h2>
          <div class="form-group"><label>Email</label><input type="email" id="login-email"></div>
          <button class="btn-primary" onclick="ingresar()">INGRESAR</button>
        </div>
      </div>
    </div>

    <div id="view-pronosticos" class="view">
      <div id="stats-bar" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px; margin-bottom:20px;"></div>
      <div id="lista-partidos"></div>
      <div style="height: 100px;"></div>
    </div>

    <div id="view-ranking" class="view">
      <h2 style="text-align:center;">RANKING GENERAL</h2>
      <div id="ranking-container" class="card" style="padding:0;"></div>
    </div>

    <div id="view-resultados" class="view">
      <h2 style="text-align:center;">RESULTADOS</h2>
      <div id="resultados-container"></div>
    </div>
  </div>

  <div id="footer-save" class="sticky-footer" style="display: none;">
    <button class="btn-primary" style="max-width: 400px;" onclick="guardarTodo()">GUARDAR PRONÓSTICOS</button>
  </div>

  <script>
    let userEmail = localStorage.getItem('qEmail') || "";
    let partidosGlobal = [];
    let intervalContadores;

    function showSpinner() { document.getElementById('spinner').style.display = 'flex'; }
    function hideSpinner() { document.getElementById('spinner').style.display = 'none'; }
    function showToast(m, t) {
      const toast = document.getElementById('toast');
      toast.innerText = m;
      toast.style.background = t === 'success' ? '#10B981' : '#EF4444';
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function activateCard(t) {
      document.getElementById('card-reg').className = 'card card-selection ' + (t==='reg'?'active':'inactive');
      document.getElementById('card-login').className = 'card card-selection ' + (t==='login'?'active':'inactive');
    }

    function renderizarBandera(nombre, url) {
      const iniciales = nombre ? nombre.substring(0, 2).toUpperCase() : "??";
      return `<img src="${url}" alt="${nombre}" class="bandera-img" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
              <span class="bandera-fallback" style="display:none;">${iniciales}</span>`;
    }

    function registrar() {
      const e = document.getElementById('reg-email').value, n = document.getElementById('reg-nombre').value, a = document.getElementById('reg-alias').value;
      if (!e || !n || !a) return showToast("Faltan datos", "error");
      showSpinner();
      google.script.run.withSuccessHandler(res => {
        if (res.success) { userEmail = e; localStorage.setItem('qEmail', e); entrar(); }
        else { showToast(res.error, "error"); hideSpinner(); }
      }).registrarParticipante(e, n, a);
    }

    function ingresar() {
      const e = document.getElementById('login-email').value;
      if (!e) return showToast("Ingresa email", "error");
      showSpinner();
      google.script.run.withSuccessHandler(res => {
        if (res.success) { userEmail = e; localStorage.setItem('qEmail', e); entrar(); }
        else { showToast(res.error, "error"); hideSpinner(); }
      }).loginParticipante(e);
    }

    function entrar() {
      document.getElementById('view-login').classList.remove('active');
      document.getElementById('navbar').style.display = 'flex';
      showView('pronosticos');
    }

    function showView(v) {
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      document.getElementById('view-' + v).classList.add('active');
      document.querySelectorAll('.navbar-tab').forEach(x => x.classList.remove('active'));
      if(document.getElementById('tab-'+v)) document.getElementById('tab-'+v).classList.add('active');
      document.getElementById('footer-save').style.display = (v === 'pronosticos') ? 'block' : 'none';
      if (v === 'pronosticos') cargarDatosPronosticos();
      if (v === 'ranking') cargarRanking();
      if (v === 'resultados') cargarResultados();
    }

    function cargarDatosPronosticos() {
      showSpinner();
      google.script.run.withSuccessHandler(partidos => {
        partidosGlobal = partidos;
        google.script.run.withSuccessHandler(pronos => {
          google.script.run.withSuccessHandler(user => {
            renderizarStats(user, pronos);
            renderizarPartidos(partidos, pronos);
            hideSpinner();
          }).obtenerParticipante(userEmail);
        }).obtenerPronosticos(userEmail);
      }).obtenerPartidos();
    }

    function renderizarStats(u, p) {
      document.getElementById('stats-bar').innerHTML = `
        <div class="card" style="padding:15px; text-align:center;"><b>PUNTOS</b><br>${u.Puntos_Totales}</div>
        <div class="card" style="padding:15px; text-align:center;"><b>EXACTOS</b><br>${u.Aciertos_Exactos}</div>
        <div class="card" style="padding:15px; text-align:center;"><b>COMPLETADOS</b><br>${p.length}/104</div>
      `;
    }

    function renderizarPartidos(partidos, pronos) {
      const container = document.getElementById('lista-partidos');
      container.innerHTML = "";
      let fase = "";
      partidos.sort((a,b) => a.Match_Num - b.Match_Num).forEach(p => {
        if (p.Fase !== fase) {
          fase = p.Fase;
          const h = document.createElement('div'); h.className = 'fase-header'; h.innerText = fase;
          container.appendChild(h);
        }
        const pr = pronos.find(x => x.ID_Partido === p.ID_Partido);
        const gl = pr ? pr.Gol_Local : "", gv = pr ? pr.Gol_Visita : "";
        const row = document.createElement('div'); row.className = 'fila-partido';
        row.innerHTML = `
          <div class="equipo-col local"><span class="nombre-equipo">${p.Equipo_Local}</span>${renderizarBandera(p.Equipo_Local, p.urlBanderaLocal)}</div>
          <div class="marcadores">
            <input type="number" id="L-${p.ID_Partido}" class="input-marcador" value="${gl}" min="0" max="99">
            <span>-</span>
            <input type="number" id="V-${p.ID_Partido}" class="input-marcador" value="${gv}" min="0" max="99">
          </div>
          <div class="equipo-col visita">${renderizarBandera(p.Equipo_Visita, p.urlBanderaVisita)}<span class="nombre-equipo">${p.Equipo_Visita}</span></div>
          <div class="estado-col">
            <span class="badge" id="badge-${p.ID_Partido}">...</span>
            <span class="contador" id="cont-${p.ID_Partido}"></span>
          </div>
        `;
        container.appendChild(row);
      });
      actualizarContadores();
      if (intervalContadores) clearInterval(intervalContadores);
      intervalContadores = setInterval(actualizarContadores, 60000);
    }

    function actualizarContadores() {
      const ahora = new Date();
      partidosGlobal.forEach(p => {
        const badge = document.getElementById(`badge-${p.ID_Partido}`);
        const cont = document.getElementById(`cont-${p.ID_Partido}`);
        const iL = document.getElementById(`L-${p.ID_Partido}`);
        const iV = document.getElementById(`V-${p.ID_Partido}`);
        if (!badge) return;

        if (p.Estado === 'JUGADO') {
          badge.innerText = "JUGADO"; badge.className = "badge badge-jugado";
          cont.innerText = `Resultado: ${p.Gol_Local_Real}-${p.Gol_Visita_Real}`;
          iL.disabled = iV.disabled = true;
        } else {
          const fCierre = new Date(p.Fecha_Cierre);
          if (ahora >= fCierre) {
            badge.innerText = "CERRADO"; badge.className = "badge badge-cerrado";
            cont.innerText = "Pronóstico bloqueado";
            iL.disabled = iV.disabled = true;
          } else {
            badge.innerText = "ABIERTO"; badge.className = "badge badge-abierto";
            const diff = fCierre - ahora;
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000);
            cont.innerText = `Cierra en: ${d}d ${h}h`;
            iL.disabled = iV.disabled = false;
            if (p.Equipo_Local.includes('Grupo') || p.Equipo_Local.includes('Ganador')) iL.disabled = iV.disabled = true;
          }
        }
      });
    }

    function guardarTodo() {
      const arr = [];
      partidosGlobal.forEach(p => {
        const iL = document.getElementById('L-'+p.ID_Partido), iV = document.getElementById('V-'+p.ID_Partido);
        if (iL && !iL.disabled && iL.value !== "" && iV.value !== "") {
          arr.push({ idPartido: p.ID_Partido, golLocal: parseInt(iL.value), golVisita: parseInt(iV.value) });
        }
      });
      if (!arr.length) return showToast("Nada que guardar", "error");
      showSpinner();
      google.script.run.withSuccessHandler(res => {
        if (res.success) { showToast("¡Guardado!", "success"); cargarDatosPronosticos(); }
        else { showToast(res.message, "error"); hideSpinner(); }
      }).guardarPronosticos(userEmail, arr);
    }

    function cargarRanking() {
      showSpinner();
      google.script.run.withSuccessHandler(ranking => {
        let h = `<table style="width:100%; border-collapse:collapse;">
          <tr style="background:#1E293B; color:white;"><th style="padding:10px;">POS</th><th style="padding:10px;text-align:left;">ALIAS</th><th style="padding:10px;">PTS</th></tr>`;
        ranking.forEach((r, i) => {
          h += `<tr style="border-bottom:1px solid #ddd;"><td style="padding:10px;text-align:center;">${i+1}</td><td style="padding:10px;">${r.Alias}</td><td style="padding:10px;text-align:center;font-weight:bold;">${r.Puntos_Totales}</td></tr>`;
        });
        h += `</table>`;
        document.getElementById('ranking-container').innerHTML = h;
        hideSpinner();
      }).obtenerRanking();
    }

    function cargarResultados() {
      showSpinner();
      google.script.run.withSuccessHandler(partidos => {
        const container = document.getElementById('resultados-container');
        container.innerHTML = "";
        let fase = "";
        partidos.sort((a,b) => a.Match_Num - b.Match_Num).forEach(p => {
          if(p.Fase !== fase) { fase = p.Fase; const h = document.createElement('div'); h.className = 'fase-header'; h.innerText = fase; container.appendChild(h); }
          const res = p.Estado === 'JUGADO' ? `${p.Gol_Local_Real} - ${p.Gol_Visita_Real}` : "VS";
          const div = document.createElement('div'); div.className = 'fila-partido';
          div.innerHTML = `<div class="equipo-col local">${p.Equipo_Local} ${renderizarBandera(p.Equipo_Local, p.urlBanderaLocal)}</div><div style="font-weight:bold;">${res}</div><div class="equipo-col visita">${renderizarBandera(p.Equipo_Visita, p.urlBanderaVisita)} ${p.Equipo_Visita}</div>`;
          container.appendChild(div);
        });
        hideSpinner();
      }).obtenerPartidos();
    }

    window.onload = () => { if (userEmail) entrar(); };
  </script>
</body>
</html>
