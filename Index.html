<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiniela Mundial 2026</title>
  <style>
    :root {
      /* Primarios - Fríos */
      --color-primary: #4F46E5;        /* Índigo 600 */
      --color-primary-dark: #3730A3;   /* Índigo 800 */
      --color-primary-light: #818CF8;  /* Índigo 400 */

      /* Secundarios - Cian/Azul */
      --color-secondary: #06B6D4;      /* Cian 500 */
      --color-secondary-light: #67E8F9; /* Cian 300 */
      --color-accent: #0EA5E9;         /* Celeste 500 */

      /* Neutros fríos */
      --color-bg: #F8FAFC;             /* Slate 50 */
      --color-bg-card: #FFFFFF;
      --color-bg-alt: #F1F5F9;         /* Slate 100 */
      --color-border: #E2E8F0;         /* Slate 200 */
      --color-border-focus: #94A3B8;     /* Slate 400 */

      /* Texto */
      --color-text: #0F172A;           /* Slate 900 */
      --color-text-secondary: #475569;  /* Slate 600 */
      --color-text-muted: #94A3B8;      /* Slate 400 */

      /* Estados */
      --color-success: #10B981;        /* Esmeralda 500 */
      --color-success-bg: #D1FAE5;
      --color-warning: #F59E0B;        /* Ámbar 500 */
      --color-warning-bg: #FEF3C7;
      --color-error: #EF4444;          /* Rojo 500 */
      --color-error-bg: #FEE2E2;
      --color-info: #3B82F6;           /* Azul 500 */
      --color-info-bg: #DBEAFE;

      /* Gradientes fríos */
      --gradient-header: linear-gradient(135deg, #1E3A5F 0%, #0F172A 100%);
      --gradient-card: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      --gradient-button: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    /* Navbar */
    .navbar {
      background: var(--gradient-header);
      border-bottom: 1px solid #1E293B;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.3);
      color: white;
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-logo {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.5px;
      font-size: 1.4rem;
      text-decoration: none;
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
    }

    .navbar-tab {
      background: none;
      border: none;
      color: #CBD5E1;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }

    .navbar-tab:hover, .navbar-tab.active {
      color: #67E8F9;
      border-bottom: 2px solid #06B6D4;
    }

    /* Container */
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Cards */
    .card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
      padding: 25px;
      margin-bottom: 20px;
    }
    .card:hover {
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
    }

    /* Login UI */
    .login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .login-grid { grid-template-columns: 1fr; }
    }

    .card-registro { border-left: 4px solid #6366F1; }
    .card-login { border-left: 4px solid #06B6D4; }

    .card-selection { cursor: pointer; border: 2px solid transparent; }
    .card-selection.inactive { opacity: 0.7; transform: scale(0.95); }
    .card-selection.active {
      transform: scale(1.02);
      opacity: 1;
      box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.2);
    }
    #card-reg.active { border-color: #6366F1; }
    #card-login.active { border-color: #06B6D4; }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .card-header span { font-size: 24px; }
    .card-header h2 { margin: 0; font-size: 1.25rem; color: var(--color-primary); }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--color-text-secondary); font-size: 0.9rem; }

    input[type="email"], input[type="text"], input[type="number"] {
      width: 100%;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      color: #0F172A;
      background: #FFFFFF;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      outline: none;
    }

    /* Buttons */
    .btn-primary {
      background: var(--gradient-button);
      color: #FFFFFF;
      border: none;
      padding: 12px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
    }
    .btn-primary:active { transform: translateY(0); }

    /* Banderas */
    .bandera {
      font-size: 28px;
      line-height: 1;
      display: inline-block;
      margin: 0 8px;
      vertical-align: middle;
    }
    .bandera-fallback {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
      margin: 0 8px;
    }

    /* Partidos */
    .fase-header {
      background: linear-gradient(90deg, #1E3A5F 0%, #312E81 100%);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 24px 0 16px 0;
      box-shadow: 0 2px 8px rgba(30, 58, 95, 0.3);
      text-align: center;
    }

    .fila-partido {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      border-bottom: 1px solid var(--color-border);
      background: white;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .fila-partido:hover { background: #F8FAFC; }

    .equipo-col {
      display: flex;
      align-items: center;
      width: 35%;
    }
    .equipo-col.local { justify-content: flex-end; text-align: right; }
    .equipo-col.visita { justify-content: flex-start; text-align: left; }

    .nombre-equipo { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }

    .marcadores {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 25%;
      justify-content: center;
    }

    .input-marcador {
      width: 60px;
      height: 45px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      background: #FFFFFF;
      color: #1E293B;
      transition: all 0.2s ease;
    }
    .input-marcador:focus {
      border-color: #06B6D4;
      background: #F0F9FF;
      outline: none;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }
    .input-marcador:disabled {
      background: #F1F5F9;
      border-color: #E2E8F0;
      color: #94A3B8;
      cursor: not-allowed;
    }
    .input-marcador.tiene-valor {
      border-color: #06B6D4;
      background: #F0F9FF;
    }
    .separador { font-weight: bold; color: var(--color-text-muted); }

    .estado-col { width: 15%; text-align: center; }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .badge-abierto { background: #DBEAFE; color: #1D4ED8; border: 1px solid #93C5FD; }
    .badge-cerrado { background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }
    .badge-jugado { background: #D1FAE5; color: #059669; border: 1px solid #6EE7B7; }
    .badge-warning { background: #FEF3C7; color: #D97706; border: 1px solid #FCD34D; }

    .contador { font-size: 10px; color: var(--color-text-secondary); font-weight: 600; }

    /* Ranking */
    .ranking-header { background: #1E293B; color: #F8FAFC; }
    .ranking-row:nth-child(even) { background: #F8FAFC; }
    .ranking-top-1 { background: linear-gradient(90deg, #1E3A5F 0%, #0F172A 100%) !important; color: #FFFFFF; }
    .ranking-top-2 { background: linear-gradient(90deg, #334155 0%, #1E293B 100%) !important; color: #FFFFFF; }
    .ranking-top-3 { background: linear-gradient(90deg, #475569 0%, #334155 100%) !important; color: #FFFFFF; }

    /* Footer Save */
    .sticky-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 15px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
      text-align: center;
      z-index: 100;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 20px; right: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 700;
      z-index: 3000;
      display: none;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .toast-success { background: #0F172A; color: #34D399; border-left: 4px solid #10B981; }
    .toast-error { background: #0F172A; color: #FCA5A5; border-left: 4px solid #EF4444; }

    /* Spinner */
    #spinner {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(248, 250, 252, 0.8);
      display: none; justify-content: center; align-items: center;
      z-index: 4000;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid var(--color-primary);
      border-radius: 50%;
      width: 50px; height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #error-msg-reg, #error-msg-login { color: var(--color-error); font-size: 0.8rem; margin-top: 5px; font-weight: 600; display: none; }
  </style>
</head>
<body>

  <div id="spinner"><div class="loader"></div></div>
  <div id="toast"></div>

  <nav class="navbar" id="navbar" style="display: none;">
    <a href="#" class="navbar-logo">🏆 <span style="background: var(--gradient-button); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">QUINIELA 2026</span></a>
    <div class="nav-tabs">
      <button onclick="showView('pronosticos')" class="navbar-tab" id="tab-pronosticos">Mis Pronósticos</button>
      <button onclick="showView('ranking')" class="navbar-tab" id="tab-ranking">Ranking</button>
      <button onclick="showView('resultados')" class="navbar-tab" id="tab-resultados">Resultados</button>
    </div>
  </nav>

  <div class="container">

    <!-- VISTA: LOGIN / REGISTRO -->
    <div id="view-login" class="view active">
      <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">MUNDIAL 2026 ❄️</h1>
        <p style="color: var(--color-text-secondary); font-weight: 500;">Ingresa tus pronósticos y compite por la gloria</p>
      </div>

      <div class="login-grid">
        <!-- REGISTRO -->
        <div class="card card-registro card-selection" id="card-reg" onclick="activateCard('reg')">
          <div class="card-header">
            <span>👤</span>
            <h2>SOY NUEVO USUARIO</h2>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="ejemplo@correo.com">
          </div>
          <div class="form-group">
            <label for="reg-nombre">Nombre Completo</label>
            <input type="text" id="reg-nombre" maxlength="50" placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label for="reg-alias">Alias (máx 15)</label>
            <input type="text" id="reg-alias" maxlength="15" placeholder="ElCrack26">
          </div>
          <div id="error-msg-reg"></div>
          <button class="btn-primary" onclick="registrar()">CREAR CUENTA</button>
        </div>

        <!-- LOGIN -->
        <div class="card card-login card-selection" id="card-login" onclick="activateCard('login')">
          <div class="card-header">
            <span>🔑</span>
            <h2>YA TENGO CUENTA</h2>
          </div>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="tu@email.com">
          </div>
          <div id="error-msg-login"></div>
          <button class="btn-primary" onclick="ingresar()">INGRESAR</button>
          <p id="no-ac-link" style="display:none; font-size: 0.8rem; text-align: center; margin-top: 15px;">
            ¿No tienes cuenta? <a href="#" onclick="activateCard('reg')" style="color:var(--color-primary); font-weight:bold;">Regístrate aquí</a>
          </p>
        </div>
      </div>
    </div>

    <!-- VISTA: DASHBOARD / PRONOSTICOS -->
    <div id="view-pronosticos" class="view">
      <div id="dashboard-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px;">
        <!-- Se llena dinámicamente -->
      </div>
      <h2 style="text-align: center; margin-bottom: 5px;">MIS PRONÓSTICOS 🔹</h2>
      <p style="text-align: center; font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 25px;">Cierre 24h antes de cada partido. Resultado final incluye penales.</p>

      <div style="text-align: center; margin-bottom: 25px;">
        <select id="filtro-fase" onchange="renderizarListaPartidos(partidosGlobal, pronosticosUsuario)"
          style="padding: 12px; border-radius: 12px; border: 2px solid var(--color-primary); background: white; font-weight: 600; color: var(--color-primary);">
          <option value="Todas">Todas las Fases</option>
          <option value="Grupos">Fase de Grupos</option>
          <option value="Ronda de 32">Ronda de 32</option>
          <option value="Octavos">Octavos de Final</option>
          <option value="Cuartos">Cuartos de Final</option>
          <option value="Semifinales">Semifinales</option>
          <option value="Tercer Puesto">Tercer Puesto</option>
          <option value="Final">Final</option>
        </select>
        <div id="match-counter" style="margin-top: 15px; font-weight: 700; color: var(--color-primary);"></div>
      </div>

      <div id="lista-partidos" class="match-list"></div>
      <div style="height: 120px;"></div>
    </div>

    <!-- VISTA: RANKING -->
    <div id="view-ranking" class="view">
      <h2 style="text-align: center; margin-bottom: 30px;">TABLA DE CLASIFICACIÓN 💠</h2>
      <div id="tabla-ranking-container" class="card" style="padding: 0; overflow: hidden;"></div>
    </div>

    <!-- VISTA: RESULTADOS -->
    <div id="view-resultados" class="view">
      <h2 style="text-align: center; margin-bottom: 30px;">RESULTADOS OFICIALES 🧊</h2>
      <div id="resultados-container"></div>
    </div>

  </div>

  <div id="footer-save" class="sticky-footer" style="display: none;">
    <button class="btn-primary" style="max-width: 400px;" onclick="guardarTodo()">GUARDAR PRONÓSTICOS</button>
  </div>

  <script>
    let userEmail = localStorage.getItem('quinielaEmail') || "";
    let userData = null;
    let partidosGlobal = [];
    let pronosticosUsuario = [];

    const COLORES_PAIS = {
      "México": "#006847", "Sudáfrica": "#007C59", "Brasil": "#FED100", "España": "#AA151B",
      "Argentina": "#75AADB", "Alemania": "#000000", "Francia": "#002395", "Portugal": "#E42518",
      "Inglaterra": "#CE1124", "Países Bajos": "#21468B", "Bélgica": "#000000", "Uruguay": "#0038A8"
    };

    const BANDERAS = {
      "México": "🇲🇽", "Sudáfrica": "🇿🇦", "Corea del Sur": "🇰🇷", "República Checa": "🇨🇿",
      "Canadá": "🇨🇦", "Bosnia y Herzegovina": "🇧🇦", "Qatar": "🇶🇦", "Suiza": "🇨🇭",
      "Brasil": "🇧🇷", "Marruecos": "🇲🇦", "Haití": "🇭🇹", "Escocia": "🏴󠁧󠁢󠁳󠁣󠁴󠁿",
      "Estados Unidos": "🇺🇸", "Paraguay": "🇵🇾", "Australia": "🇦🇺", "Turquía": "🇹🇷",
      "Alemania": "🇩🇪", "Curazao": "🇨🇼", "Costa de Marfil": "🇨🇮", "Ecuador": "🇪🇨",
      "Países Bajos": "🇳🇱", "Japón": "🇯🇵", "Suecia": "🇸🇪", "Túnez": "🇹🇳",
      "Bélgica": "🇧🇪", "Egipto": "🇪🇬", "Irán": "🇮🇷", "Nueva Zelanda": "🇳🇿",
      "España": "🇪🇸", "Cabo Verde": "🇨🇻", "Arabia Saudita": "🇸🇦", "Uruguay": "🇺🇾",
      "Francia": "🇫🇷", "Senegal": "🇸🇳", "Irak": "🇮🇶", "Noruega": "🇳🇴",
      "Argentina": "🇦🇷", "Argelia": "🇩🇿", "Austria": "🇦🇹", "Jordania": "🇯🇴",
      "Portugal": "🇵🇹", "RD Congo": "🇨🇩", "Uzbekistán": "🇺🇿", "Colombia": "🇨🇴",
      "Inglaterra": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Croacia": "🇭🇷", "Ghana": "🇬🇭", "Panamá": "🇵🇦"
    };

    function showSpinner() { document.getElementById('spinner').style.display = 'flex'; }
    function hideSpinner() { document.getElementById('spinner').style.display = 'none'; }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = type === 'success' ? 'toast-success' : 'toast-error';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function activateCard(type) {
      document.getElementById('card-reg').className = 'card card-registro card-selection ' + (type === 'reg' ? 'active' : 'inactive');
      document.getElementById('card-login').className = 'card card-login card-selection ' + (type === 'login' ? 'active' : 'inactive');
    }

    function esEmojiSoportado(emoji) {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = "24px Arial";
      const width = ctx.measureText(emoji).width;
      return width > 1;
    }

    function renderizarBandera(nombrePais) {
      const emoji = BANDERAS[nombrePais] || "";
      if (emoji && esEmojiSoportado(emoji)) {
        return `<span class="bandera">${emoji}</span>`;
      } else {
        const iniciales = nombrePais ? nombrePais.substring(0, 2).toUpperCase() : "??";
        const color = COLORES_PAIS[nombrePais] || "#4F46E5";
        return `<span class="bandera-fallback" style="background:${color}">${iniciales}</span>`;
      }
    }

    function showView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');

      document.querySelectorAll('.navbar-tab').forEach(b => b.classList.remove('active'));
      const tab = document.getElementById('tab-' + viewName);
      if(tab) tab.classList.add('active');

      document.getElementById('footer-save').style.display = (viewName === 'pronosticos') ? 'block' : 'none';

      if (viewName === 'pronosticos') cargarPartidos();
      if (viewName === 'ranking') cargarRanking();
      if (viewName === 'resultados') cargarResultados();
    }

    function registrar() {
      const email = document.getElementById('reg-email').value;
      const nombre = document.getElementById('reg-nombre').value;
      const alias = document.getElementById('reg-alias').value;
      const errorDiv = document.getElementById('error-msg-reg');

      if (!email || !nombre || !alias) {
        errorDiv.innerText = "Completa todos los campos";
        errorDiv.style.display = "block";
        return;
      }
      errorDiv.style.display = "none";

      showSpinner();
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            userEmail = email;
            localStorage.setItem('quinielaEmail', email);
            showToast("✅ " + res.message, 'success');
            entrarApp();
          } else {
            errorDiv.innerText = res.error;
            errorDiv.style.display = "block";
          }
          hideSpinner();
        })
        .registrarParticipante(email, nombre, alias);
    }

    function ingresar() {
      const email = document.getElementById('login-email').value;
      const errorDiv = document.getElementById('error-msg-login');

      if (!email) {
        errorDiv.innerText = "Ingresa tu email";
        errorDiv.style.display = "block";
        return;
      }

      showSpinner();
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            userEmail = email;
            localStorage.setItem('quinielaEmail', email);
            entrarApp();
          } else {
            errorDiv.innerText = res.error;
            errorDiv.style.display = "block";
            document.getElementById('no-ac-link').style.display = 'block';
          }
          hideSpinner();
        })
        .loginParticipante(email);
    }

    function entrarApp() {
      document.getElementById('navbar').style.display = 'flex';
      document.getElementById('view-login').style.display = 'none';
      actualizarEstadisticas();
      showView('pronosticos');
    }

    function actualizarEstadisticas() {
      google.script.run
        .withSuccessHandler(p => {
          if (p) {
            userData = p;
            google.script.run.withSuccessHandler(pronosticos => {
              const count = pronosticos.filter(pr => pr.Gol_Local !== "" && pr.Gol_Local !== undefined).length;
              const html = `
                <div class="card" style="padding:15px; border-bottom:4px solid var(--color-primary);">
                  <div style="font-size:0.8rem; font-weight:700; color:var(--color-text-secondary);">PUNTOS</div>
                  <div style="font-size:1.8rem; font-weight:800; color:var(--color-primary);">${p.Puntos_Totales}</div>
                </div>
                <div class="card" style="padding:15px; border-bottom:4px solid var(--color-success);">
                  <div style="font-size:0.8rem; font-weight:700; color:var(--color-text-secondary);">EXACTOS</div>
                  <div style="font-size:1.8rem; font-weight:800; color:var(--color-success);">${p.Aciertos_Exactos}</div>
                </div>
                <div class="card" style="padding:15px; border-bottom:4px solid var(--color-secondary);">
                  <div style="font-size:0.8rem; font-weight:700; color:var(--color-text-secondary);">COMPLETADOS</div>
                  <div style="font-size:1.8rem; font-weight:800; color:var(--color-secondary);">${count}/104</div>
                </div>
                <div class="card" style="padding:15px; border-bottom:4px solid var(--color-error);">
                  <div style="font-size:0.8rem; font-weight:700; color:var(--color-text-secondary);">ERRORES</div>
                  <div style="font-size:1.8rem; font-weight:800; color:var(--color-error);">${p.Errores}</div>
                </div>
              `;
              document.getElementById('dashboard-stats').innerHTML = html;
            }).obtenerPronosticos(userEmail);
          }
        })
        .obtenerParticipante(userEmail);
    }

    function cargarPartidos() {
      showSpinner();
      google.script.run
        .withSuccessHandler(partidos => {
          partidosGlobal = partidos || [];
          google.script.run
            .withSuccessHandler(pronosticos => {
              pronosticosUsuario = pronosticos || [];
              renderizarListaPartidos(partidosGlobal, pronosticosUsuario);
              hideSpinner();
            })
            .obtenerPronosticos(userEmail);
        })
        .obtenerPartidos();
    }

    function renderizarListaPartidos(partidos, pronosticos) {
      const container = document.getElementById('lista-partidos');
      const filtro = document.getElementById('filtro-fase').value;
      container.innerHTML = "";

      let faseActual = "";
      const ahora = new Date();
      let matchesShown = 0;
      let predictedCount = 0;

      partidos.sort((a, b) => a.Match_Num - b.Match_Num).forEach(p => {
        if (filtro !== 'Todas' && p.Fase !== filtro) return;
        matchesShown++;

        if (p.Fase !== faseActual) {
          faseActual = p.Fase;
          const h = document.createElement('div');
          h.className = 'fase-header';
          h.innerText = faseActual;
          container.appendChild(h);
        }

        const pronostico = pronosticos.find(pr => pr.ID_Partido === p.ID_Partido);
        const golL = (pronostico && pronostico.Gol_Local !== "") ? pronostico.Gol_Local : "";
        const golV = (pronostico && pronostico.Gol_Visita !== "") ? pronostico.Gol_Visita : "";
        if (golL !== "") predictedCount++;

        const fechaCierre = new Date(p.Fecha_Cierre);
        const estaCerrado = ahora >= fechaCierre;
        const estaJugado = p.Gol_Local_Real !== "" && p.Gol_Local_Real !== null;
        const esPlaceholder = p.Equipo_Local.includes('Grupo') || p.Equipo_Local.includes('Ganador') || p.Equipo_Local.includes('Perdedor');

        let badgeClass = "badge-abierto", badgeText = "ABIERTO";
        if (estaJugado) { badgeClass = "badge-jugado"; badgeText = "JUGADO"; }
        else if (estaCerrado) { badgeClass = "badge-cerrado"; badgeText = "CERRADO"; }
        else if (esPlaceholder) { badgeClass = "badge-cerrado"; badgeText = "ESPERANDO EQUIPOS"; }
        else if (fechaCierre - ahora < 48 * 3600000) { badgeClass = "badge-warning"; badgeText = "CIERRA PRONTO"; }

        const row = document.createElement('div');
        row.className = 'fila-partido';
        if(esPlaceholder) row.style.opacity = '0.6';

        row.innerHTML = `
          <div class="equipo-col local">
            <span class="nombre-equipo">${p.Equipo_Local}</span>
            ${renderizarBandera(p.Equipo_Local)}
          </div>
          <div class="marcadores">
            <input type="number" class="input-marcador ${golL!==""?'tiene-valor':''}"
              id="L-${p.ID_Partido}" min="0" max="99" value="${golL}"
              onblur="validarInput(this)" oninput="this.classList.toggle('tiene-valor', this.value!=='')"
              ${estaCerrado || esPlaceholder ? 'disabled' : ''}>
            <span class="separador">-</span>
            <input type="number" class="input-marcador ${golV!==""?'tiene-valor':''}"
              id="V-${p.ID_Partido}" min="0" max="99" value="${golV}"
              onblur="validarInput(this)" oninput="this.classList.toggle('tiene-valor', this.value!=='')"
              ${estaCerrado || esPlaceholder ? 'disabled' : ''}>
          </div>
          <div class="equipo-col visita">
            ${renderizarBandera(p.Equipo_Visita)}
            <span class="nombre-equipo">${p.Equipo_Visita}</span>
          </div>
          <div class="estado-col">
            <span class="badge ${badgeClass}">${badgeText}</span>
            ${estaJugado ? `<small class="contador">RES: ${p.Gol_Local_Real}-${p.Gol_Visita_Real}</small>` :
              `<small class="contador">${estaCerrado?'FINALIZADO':'CIERRE: ' + new Date(p.Fecha_Cierre).toLocaleDateString()}</small>`}
          </div>
        `;
        container.appendChild(row);
      });
      document.getElementById('match-counter').innerText = `Puntos en juego: ${predictedCount} / ${partidos.length} partidos`;
    }

    function validarInput(input) {
      let val = parseInt(input.value);
      if (isNaN(val) || val < 0) input.value = 0;
      else if (val > 99) input.value = 99;
    }

    function guardarTodo() {
      const arr = [];
      partidosGlobal.forEach(p => {
        const iL = document.getElementById('L-' + p.ID_Partido);
        const iV = document.getElementById('V-' + p.ID_Partido);
        if (iL && iV && !iL.disabled && iL.value !== "" && iV.value !== "") {
          arr.push({ idPartido: p.ID_Partido, golLocal: parseInt(iL.value), golVisita: parseInt(iV.value) });
        }
      });

      if (arr.length === 0) {
        showToast("⚠️ Ingresa al menos un pronóstico completo", 'error');
        return;
      }

      showSpinner();
      google.script.run
        .withSuccessHandler(res => {
          showToast("✅ Pronósticos guardados correctamente", 'success');
          actualizarEstadisticas();
          hideSpinner();
        })
        .withFailureHandler(() => {
          showToast("❌ Error al guardar. Intenta de nuevo.", 'error');
          hideSpinner();
        })
        .guardarPronosticos(userEmail, arr);
    }

    function cargarRanking() {
      showSpinner();
      google.script.run.withSuccessHandler(ranking => {
        let html = `<table style="width:100%; border-collapse:collapse;">
          <thead class="ranking-header"><tr>
            <th style="padding:15px; text-align:center;">POS</th>
            <th style="padding:15px; text-align:left;">PARTICIPANTE</th>
            <th style="padding:15px; text-align:center;">PTS</th>
            <th style="padding:15px; text-align:center;">EX</th>
          </tr></thead><tbody>`;
        ranking.forEach((r, i) => {
          let c = "";
          if(i===0) c="ranking-top-1"; else if(i===1) c="ranking-top-2"; else if(i===2) c="ranking-top-3";
          html += `<tr class="ranking-row ${c}">
            <td style="padding:15px; text-align:center; font-weight:800;">${i+1}</td>
            <td style="padding:15px;">
              <div style="font-weight:700;">${r.Alias}</div>
              <div style="font-size:0.7rem; opacity:0.8;">${r.Nombre}</div>
            </td>
            <td style="padding:15px; text-align:center; font-weight:800;">${r.Puntos_Totales}</td>
            <td style="padding:15px; text-align:center;">${r.Aciertos_Exactos}</td>
          </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('tabla-ranking-container').innerHTML = html;
        hideSpinner();
      }).obtenerRanking();
    }

    function cargarResultados() {
      showSpinner();
      google.script.run.withSuccessHandler(partidos => {
        const container = document.getElementById('resultados-container');
        container.innerHTML = "";
        let fase = "";
        partidos.sort((a,b) => a.Match_Num - b.Match_Num).forEach(p => {
          if(p.Fase !== fase) {
            fase = p.Fase;
            const h = document.createElement('div');
            h.className = 'fase-header';
            h.innerText = fase;
            container.appendChild(h);
          }
          const div = document.createElement('div');
          div.className = 'fila-partido';
          const res = (p.Gol_Local_Real !== "" && p.Gol_Local_Real !== null) ? `${p.Gol_Local_Real} - ${p.Gol_Visita_Real}` : "VS";
          div.innerHTML = `
            <div class="equipo-col local">${p.Equipo_Local} ${renderizarBandera(p.Equipo_Local)}</div>
            <div style="font-weight:900; font-size:1.2rem; color:var(--color-primary);">${res}</div>
            <div class="equipo-col visita">${renderizarBandera(p.Equipo_Visita)} ${p.Equipo_Visita}</div>
          `;
          container.appendChild(div);
        });
        hideSpinner();
      }).obtenerPartidos();
    }

    // Auto-login
    window.onload = () => {
      if (userEmail) {
        document.getElementById('login-email').value = userEmail;
        ingresar();
      }
    };
  </script>
</body>
</html>
