<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      .form-label { font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="formProyecto">
        <div class="mb-3">
          <label class="form-label">Nombre del Proceso</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej: Adjudicación de Contratos">
        </div>
        <div class="mb-3">
          <label class="form-label">Área Responsable</label>
          <select id="area" class="form-select">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Responsable (Email)</label>
          <input type="email" id="responsable" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Observaciones</label>
          <textarea id="obs" class="form-control" rows="3"></textarea>
        </div>
        <button onclick="enviar()" id="btnEnviar" class="btn btn-primary w-100">Crear Proyecto</button>
      </div>
      <div id="status" class="mt-3 text-center"></div>
    </div>

    <script>
      window.onload = () => {
        google.script.run.withSuccessHandler(areas => {
          const select = document.getElementById('area');
          areas.forEach(a => {
            let opt = document.createElement('option');
            opt.value = a;
            opt.innerHTML = a;
            select.appendChild(opt);
          });
        }).getListaAreas();
      };

      function enviar() {
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        document.getElementById('status').innerText = "Procesando...";

        const datos = {
          nombreProceso: document.getElementById('nombre').value,
          areaResponsable: document.getElementById('area').value,
          responsable: document.getElementById('responsable').value,
          observaciones: document.getElementById('obs').value
        };

        google.script.run
          .withSuccessHandler(res => {
            if(res.success) {
              document.getElementById('formProyecto').innerHTML = `<div class="alert alert-success">¡Creado! ID: ${res.idProyecto}</div>`;
              setTimeout(() => google.script.host.close(), 2000);
            } else {
              document.getElementById('status').innerText = "Error: " + res.mensaje;
              btn.disabled = false;
            }
          })
          .crearNuevoProyecto(datos);
      }
    </script>
  </body>
</html>
